<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Microgrid Scheduler</title>
    <script>
      window.onerror = function(msg, url, lineNo, columnNo, error) {
        var pre = document.createElement('pre');
        pre.style.color = 'red'; pre.style.zIndex = '9999'; pre.style.position = 'relative';
        pre.textContent = 'Error: ' + msg + '\n' + (error ? error.stack : '');
        document.body.prepend(pre);
      };
      var oldErr = console.error;
      console.error = function() {
        var pre = document.createElement('pre');
        pre.style.color = 'red'; pre.style.zIndex = '9999'; pre.style.position = 'relative';
        pre.textContent = 'Console Error: ' + Array.from(arguments).join(' ');
        document.body.prepend(pre);
        oldErr.apply(console, arguments);
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
